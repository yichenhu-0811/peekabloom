<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Peekabloom</title>
<style>
:root{
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#eee;font-family:var(--sans);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body.clockpage{overflow:hidden;touch-action:none}
.stage{position:fixed;left:0;top:0;width:100vw;height:100vh;background:#000;overflow:hidden}
.pb-svg{display:block;width:var(--size,100vmin);height:var(--size,100vmin);overflow:visible}
.stage .pb-svg{position:absolute;left:50%;top:50%;transform:translate(calc(-50% + var(--ox,0px)),calc(-50% + var(--oy,0px)))}
.pb-svg text{font-family:var(--serif)}

/* ---------- garden ---------- */
.flw{transform-box:fill-box;transform-origin:50% 100%}
.sway{animation:sway calc(var(--d,5s) * var(--slow,1)) ease-in-out var(--dl,0s) infinite alternate}
@keyframes sway{from{transform:rotate(calc(var(--a,3deg) * -1))}to{transform:rotate(var(--a,3deg))}}
.bl{transform-box:fill-box;transform-origin:50% 50%;transform:scale(var(--open,1));transition:transform 4s ease}
.fresh{animation:pop 1.8s cubic-bezier(.2,1.5,.4,1) both}
.intro{animation:pop 1.4s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.halo{animation:halo 3.2s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.25}50%{opacity:.7}}
.fresh .halo{animation:halo 1.2s ease-in-out 3, halo 3.2s ease-in-out 3.6s infinite}
.mglow{animation:mglow 4s ease-in-out infinite}
@keyframes mglow{0%,100%{opacity:.55}50%{opacity:1}}
.twk{animation:twk 2.6s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.15}50%{opacity:1}}

/* ---------- scenes ---------- */
.scene{opacity:0;transition:opacity 1.6s ease}
.scene.on{opacity:1}
.fade{transition:opacity 1.2s ease}
.hid{display:none}
.smoke{animation:smoke 4s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:.6}100%{transform:translate(10px,-46px) scale(1.6);opacity:0}}
.star{animation:twk 3s ease-in-out infinite}
.firefly{animation:ff 7s ease-in-out infinite alternate}
@keyframes ff{0%{transform:translate(0,0)}33%{transform:translate(18px,-14px)}66%{transform:translate(-10px,-26px)}100%{transform:translate(12px,8px)}}

/* ---------- characters ---------- */
.blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.page{transform-box:fill-box;transform-origin:0% 50%;animation:page 5s ease-in-out infinite}
@keyframes page{0%,70%{transform:scaleX(1)}85%{transform:scaleX(-1)}100%{transform:scaleX(-1)}}
.steam{animation:steam 2.8s ease-out infinite}
@keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.7}100%{transform:translateY(-16px);opacity:0}}
.drop{animation:drop .9s linear infinite}
@keyframes drop{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(8px,30px);opacity:0}}
.zz{animation:zz 3s ease-out infinite}
@keyframes zz{0%{transform:translate(0,0) scale(.5);opacity:0}30%{opacity:.8}100%{transform:translate(14px,-30px) scale(1.1);opacity:0}}
.wing{transform-box:fill-box;transform-origin:100% 50%;animation:flap .22s ease-in-out infinite alternate}
.wing.r{transform-origin:0% 50%}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
.spark{animation:spark 1.6s ease-out forwards}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
.rise{animation:rise 3.5s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}100%{opacity:0;transform:translate(var(--dx,0px),-120px)}}

.wave{animation:wave 5s ease-in-out infinite}.wave.w2{animation-delay:-2.5s}
@keyframes wave{0%,100%{opacity:.18}50%{opacity:.45}}
.ripple{animation:ripple 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.4);opacity:.5}100%{transform:scale(1.4);opacity:0}}
.willow{animation:willow 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}
@keyframes willow{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.bob{animation:bobf 2.4s ease-in-out infinite}
@keyframes bobf{0%,100%{transform:translateY(0)}50%{transform:translateY(2px)}}
.campreview{position:fixed;right:12px;bottom:12px;z-index:11;width:200px;height:150px;border-radius:12px;border:1px solid #3a3530;background:#111}
@keyframes petal{from{transform:translate(var(--x0),var(--y0)) rotate(0deg)}to{transform:translate(calc(var(--x0) + 620px),calc(var(--y0) + 420px)) rotate(600deg)}}
.petal{animation:petal 10s linear infinite}
@keyframes rainf{from{transform:translate(var(--x0),var(--y0));opacity:0}20%{opacity:1}to{transform:translate(calc(var(--x0) - 30px),calc(var(--y0) + 200px));opacity:0}}
.rain{animation:rainf .8s linear infinite}
@keyframes snowf{0%{transform:translate(var(--x0),-520px)}50%{transform:translate(calc(var(--x0) + var(--sw)),0px)}100%{transform:translate(var(--x0),520px)}}
.flake{animation:snowf 11s linear infinite}
@keyframes shoot{0%{transform:translate(var(--x0),var(--y0));opacity:0}15%{opacity:1}100%{transform:translate(calc(var(--x0) + 380px),calc(var(--y0) + 160px));opacity:0}}
.shoot{animation:shoot 1.5s ease-out forwards}
@keyframes lantern{0%{transform:translate(var(--lx),var(--ly)) scale(.9);opacity:0}10%{opacity:1}85%{opacity:.85}100%{transform:translate(calc(var(--lx) + 40px),calc(var(--ly) + var(--rise))) scale(.5);opacity:0}}
.lantern{animation:lantern 15s linear infinite}
@keyframes rbw{0%{opacity:0}20%{opacity:1}75%{opacity:1}100%{opacity:0}}
.rainbow{animation:rbw 18s ease forwards}
/* ---------- dev ---------- */
.devpanel{position:fixed;left:12px;bottom:12px;z-index:10;max-width:340px;max-height:calc(100% - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;max-height:calc(100vh - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(28,26,24,.92);
  border:1px solid #3a3530;border-radius:14px;padding:12px 14px;font-size:12px;color:#e9e2d6;backdrop-filter:blur(8px)}
.devpanel.hidden{display:none}
.devpanel h4{margin:0 0 6px;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#bfb3a1}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:4px 0 9px}
.row .lab{width:100%;color:#a79b8a;font-size:11px}
button.b{font:500 12px var(--sans);border:1px solid #4a443d;background:#2b2724;color:#efe7da;border-radius:999px;
  padding:5px 11px;cursor:pointer}
button.b:hover{background:#3a342f}
button.b.on{background:#e9d9b8;color:#2b2420;border-color:#e9d9b8}
button.b.hot{background:#d98b6a;border-color:#d98b6a;color:#fff}
.badge{display:inline-block;font:600 10px var(--sans);letter-spacing:.06em;padding:3px 8px;border-radius:999px;text-transform:uppercase}
.badge.sim{background:#4b3d22;color:#f3d79b}
.badge.live{background:#23452c;color:#a8e2b4}
.pstate{font:500 11px ui-monospace,Menlo,monospace;color:#cbbfa9}

/* ---------- demo page ---------- */
body.demo{background:#14120f;overflow:auto}
.demo-wrap{max-width:1280px;margin:0 auto;padding:28px 24px 60px}
.demo-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.demo-head h1{font:400 34px var(--serif);margin:0;color:#f4ead9;letter-spacing:.01em}
.demo-head i{font:italic 17px var(--serif);color:#b8a991}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:820px){.pair{grid-template-columns:1fr}}
.clockcol{display:flex;flex-direction:column;align-items:center}
.clockbox{width:100%;aspect-ratio:1;background:#000;border-radius:28px;display:grid;place-items:center;padding:4%;
  box-shadow:inset 0 0 0 1px #2a2622}
.clockbox .pb-svg{width:100%;height:100%}
.cap{margin:12px 0 4px;text-align:center}
.cap b{font:400 20px var(--serif);color:#f2e7d4}
.cap small{display:block;color:#9e927f;font-size:12px;margin-top:2px}
.ctlcard{width:100%;background:#1d1a17;border:1px solid #2e2924;border-radius:16px;padding:12px 14px;margin-top:10px;font-size:12px;color:#e9e2d6}
.ctlcard h4{margin:0 0 4px;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#a99c88}
.global{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.note{margin-top:22px;color:#9e927f;font-size:12.5px;line-height:1.55;max-width:900px}
.note a{color:#e3c995}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
'use strict';
/* =========================================================================
   Peekabloom — a pair of connected ambient clocks
   Routes:  #parents  (parents' clock in China — shows Yichen)
            #me       (Yichen's clock in Philadelphia — shows parents)
            #demo     (developer view: both clocks side by side)
            (#/parents style also accepted)
   Also works as real paths /parents and /me on a static host.
   ========================================================================= */

const Q = new URLSearchParams(location.search);
const NS = 'http://www.w3.org/2000/svg';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const rand = (a, b) => a + Math.random() * (b - a);
const rid = () => Math.random().toString(36).slice(2, 9);
const other = id => id === 'me' ? 'parents' : 'me';
const DEG = Math.PI / 180;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function h(tag, attrs = {}, parent) {
  const e = document.createElement(tag);
  for (const k in attrs) { if (k === 'text') e.textContent = attrs[k]; else if (k === 'html') e.innerHTML = attrs[k]; else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else e.setAttribute(k, attrs[k]); }
  if (parent) parent.appendChild(e); return e;
}
function sg(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e); return e;
}

/* ---------------------------- time zones ---------------------------- */
const fmtCache = {}, offCache = {};
function zonedParts(ts, tz) {
  const f = fmtCache[tz] || (fmtCache[tz] = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' }));
  const p = {}; for (const x of f.formatToParts(ts)) p[x.type] = x.value;
  return { y: +p.year, mo: +p.month, d: +p.day, h: (+p.hour) % 24, mi: +p.minute, s: +p.second };
}
function tzOffset(tz, ts) {
  const c = offCache[tz];
  if (c && Math.abs(ts - c.at) < 30000) return c.off;
  const z = zonedParts(ts, tz);
  const off = Date.UTC(z.y, z.mo - 1, z.d, z.h, z.mi, z.s) - (ts - ((ts % 1000) + 1000) % 1000);
  offCache[tz] = { at: ts, off }; return off;
}
function local(ts, tz) {
  const d = new Date(ts + tzOffset(tz, ts));
  return { y: d.getUTCFullYear(), mo: d.getUTCMonth(), d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), s: d.getUTCSeconds(), ms: d.getUTCMilliseconds() };
}
function zonedToUtc(y, mo, d, hh, mi, tz) { const g = Date.UTC(y, mo, d, hh, mi); const o = tzOffset(tz, g); delete offCache[tz]; return g - o; }
const DEVICE_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
// time-of-day: night 0..1, golden (dawn/dusk) 0..1
function todFor(hf) {
  const s = (a, b, x) => clamp((x - a) / (b - a), 0, 1);
  const night = hf < 12 ? 1 - s(5, 7, hf) : s(19, 21, hf);
  const golden = Math.max(Math.exp(-Math.pow((hf - 6.5) / 1.1, 2)), Math.exp(-Math.pow((hf - 18.8) / 1.2, 2)));
  return { night, golden };
}

/* ---------------------------- people & themes ---------------------------- */
const PEOPLE = {
  me: { name: 'Yichen', char: 'pip', tz: 'America/New_York', city: 'Philadelphia' },
  parents: { name: 'Mom & Dad', char: 'tang', tz: 'Asia/Shanghai', city: 'China' }
};
// THEMES are keyed by CLOCK id. Clock "parents" belongs to the parents and shows Yichen.
const THEMES = {
  parents: { // spring sage island — Pip's Philadelphia
    sea0: '#BFE0D6', sea1: '#94C4BD', wave: '#F4FBF6', sand: '#EEE4C9', sandShade: '#DDD0AF', grass: '#A2C487', grass2: '#B6D49B', tuft: '#80A66E',
    ink: '#33433A', accent: '#87A47F', glow: '#FFE7A8', marker: '#FFFDF7', leaf: '#7C9A70', stem: '#6C875F',
    tree1: '#7FAE72', tree2: '#64955E', pine: '#4F8762', trunk: '#8B6B52', pond: '#4E8098', pondEdge: '#A2C9D0', pathC: '#E7DDC2', plot: '#9A7A60', plotIn: '#7F6250',
    wall: '#D58A6D', roof: '#6F86A6', door: '#4F6B5A', trim: '#F6EFE2',
    flowers: ['daisy', 'forget', 'bell', 'sprig'], lang: 'zh', homeArc: '#E7C796', outArc: '#87A47F', place: 'philly'
  },
  me: { // warm golden island — Mom & Dad's China
    sea0: '#F7D9C2', sea1: '#E8B597', wave: '#FFF6EA', sand: '#F8E7CB', sandShade: '#EBD2AE', grass: '#CDC38B', grass2: '#DCD39E', tuft: '#ABA36C',
    ink: '#5A3B2E', accent: '#C9785D', glow: '#FFE2A0', marker: '#FFFAF1', leaf: '#8DA36C', stem: '#7A8F5C',
    tree1: '#E6A66B', tree2: '#CB8255', pine: '#9DAE6E', trunk: '#8A6550', pond: '#6C9E9B', pondEdge: '#BCD6CC', pathC: '#F4E5C9', plot: '#A9805F', plotIn: '#8D6A4E',
    wall: '#FBEBD4', roof: '#8E5B4A', door: '#C9785D', trim: '#F6EFE2',
    flowers: ['tulip', 'marigold', 'camellia', 'poppy'], lang: 'en', homeArc: '#F2D486', outArc: '#C9785D', place: 'china'
  }
};

/* ---------------------------- shared state hubs ---------------------------- */
function initialState() {
  const now = Date.now();
  return {
    presence: { me: { present: false, session: '', ts: 0 }, parents: { present: false, session: '', ts: 0 } },
    status: { me: { place: 'out', activity: 'walking', ts: now }, parents: { place: 'home', activity: 'casual', ts: now } },
    history: { me: {}, parents: {} },
    gardens: { me: {}, parents: {} },
    meta: { seeded: false }
  };
}
function setPath(obj, path, value) {
  let o = obj;
  for (let i = 0; i < path.length - 1; i++) { if (o[path[i]] == null || typeof o[path[i]] !== 'object') o[path[i]] = {}; o = o[path[i]]; }
  const k = path[path.length - 1];
  if (value === null || value === undefined) delete o[k]; else o[k] = value;
}
function deepMerge(base, add) {
  if (add == null || typeof add !== 'object') return add == null ? base : add;
  const out = Array.isArray(base) ? [] : { ...(base || {}) };
  for (const k in add) out[k] = (base && typeof base[k] === 'object' && typeof add[k] === 'object') ? deepMerge(base[k], add[k]) : add[k];
  return out;
}

/** LocalHub — simulation. State lives in localStorage and is broadcast between
 *  tabs of the SAME browser via BroadcastChannel. Not cross-device. */
class LocalHub {
  constructor() {
    this.kind = 'local'; this.key = 'peekabloom.v1'; this.subs = new Set(); this.pending = false;
    let st = null; try { st = JSON.parse(localStorage.getItem(this.key)); } catch (e) {}
    this.state = deepMerge(initialState(), st || {});
    this.bc = ('BroadcastChannel' in window) ? new BroadcastChannel('peekabloom') : null;
    if (this.bc) this.bc.onmessage = e => { const m = e.data; if (m && m.reset) { this.state = deepMerge(initialState(), m.state); } else if (m) setPath(this.state, m.path, m.value); this.emit(); };
    this.connected = true;
  }
  label() { return 'Local simulation · syncs only between tabs of this browser'; }
  subscribe(fn) { this.subs.add(fn); fn(this.state); return () => this.subs.delete(fn); }
  emit() { if (this.pending) return; this.pending = true; queueMicrotask(() => { this.pending = false; for (const f of this.subs) f(this.state); }); }
  persist() { try { localStorage.setItem(this.key, JSON.stringify(this.state)); } catch (e) {} }
  set(path, value) {
    setPath(this.state, path, value); this.persist();
    if (this.bc) this.bc.postMessage({ path, value: value === undefined ? null : value });
    this.emit();
  }
  reset(state) { this.state = deepMerge(initialState(), state || {}); this.persist(); if (this.bc) this.bc.postMessage({ reset: true, state: this.state }); this.emit(); }
}

/** FirebaseHub — real cross-device sync with zero dependencies, using the
 *  Firebase Realtime Database REST API + its EventSource streaming endpoint.
 *  Enable with ?db=https://<project>-default-rtdb.firebaseio.com  (optional &auth=<token>) */
class FirebaseHub {
  constructor(url, auth) {
    this.kind = 'firebase'; this.subs = new Set(); this.pending = false; this.connected = false;
    this.base = url.replace(/\/+$/, '') + '/peekabloom';
    this.q = auth ? ('?auth=' + encodeURIComponent(auth)) : '';
    this.state = initialState();
    this.host = new URL(url).host;
    const es = new EventSource(this.base + '.json' + this.q);
    const apply = (path, data, merge) => {
      const parts = path.split('/').filter(Boolean);
      if (!parts.length) { this.state = merge ? deepMerge(this.state, data) : deepMerge(initialState(), data || {}); }
      else if (merge) { for (const k in data) setPath(this.state, parts.concat(k), data[k]); }
      else setPath(this.state, parts, data);
      this.emit();
    };
    es.addEventListener('put', e => { const m = JSON.parse(e.data); this.connected = true; apply(m.path, m.data, false); });
    es.addEventListener('patch', e => { const m = JSON.parse(e.data); apply(m.path, m.data, true); });
    es.onerror = () => { this.connected = false; this.emit(); };
    es.onopen = () => { this.connected = true; this.emit(); };
  }
  label() { return 'Live sync · Firebase ' + this.host + (this.connected ? ' · connected' : ' · connecting…'); }
  subscribe(fn) { this.subs.add(fn); fn(this.state); return () => this.subs.delete(fn); }
  emit() { if (this.pending) return; this.pending = true; queueMicrotask(() => { this.pending = false; for (const f of this.subs) f(this.state); }); }
  set(path, value) {
    setPath(this.state, path, value); this.emit();
    fetch(this.base + '/' + path.join('/') + '.json' + this.q, { method: value == null ? 'DELETE' : 'PUT', body: value == null ? undefined : JSON.stringify(value) }).catch(() => {});
  }
  reset(state) { this.state = deepMerge(initialState(), state || {}); this.emit(); fetch(this.base + '.json' + this.q, { method: 'PUT', body: JSON.stringify(this.state) }).catch(() => {}); }
}

const HUB = Q.get('db') ? new FirebaseHub(Q.get('db'), Q.get('auth')) : new LocalHub();

/* ---------------------------- demo history ---------------------------- */
// A plausible "yesterday + today" in each person's own time zone (simulated data).
const DAY_PLANS = {
  me: [[0, 'home', 'resting'], [8.5, 'home', 'casual'], [9.25, 'out', 'active'], [10, 'out', 'casual'], [12.5, 'out', 'walking'], [13.25, 'out', 'resting'], [14, 'out', 'casual'], [17.5, 'out', 'active'], [18.25, 'home', 'casual'], [20, 'home', 'walking'], [21.5, 'home', 'resting']],
  parents: [[0, 'home', 'resting'], [6, 'home', 'active'], [7, 'out', 'walking'], [8, 'out', 'casual'], [9.5, 'home', 'casual'], [12.5, 'home', 'resting'], [15, 'out', 'walking'], [16.5, 'out', 'resting'], [17.5, 'home', 'casual'], [19.5, 'home', 'walking'], [21, 'home', 'resting']]
};
function demoHistory(person) {
  const tz = PEOPLE[person].tz, now = Date.now(), out = {};
  for (let back = 2; back >= 0; back--) {
    const l = local(now - back * 864e5, tz);
    for (const [hr, place, activity] of DAY_PLANS[person]) {
      const ts = zonedToUtc(l.y, l.mo, l.d, Math.floor(hr), Math.round((hr % 1) * 60), tz);
      if (ts <= now && ts > now - 50 * 3600e3) out[ts] = { ts, place, activity, demo: true };
    }
  }
  return out;
}
function statusAt(hist, ts) {
  let best = null;
  for (const k in hist) { const e = hist[k]; if (e.ts <= ts && (!best || e.ts > best.ts)) best = e; }
  return best;
}
function seedIfNeeded() {
  const s = HUB.state;
  if (HUB.kind !== 'local' || s.meta.seeded) return;
  const st = {};
  for (const p of ['me', 'parents']) {
    const hist = demoHistory(p); st[p] = hist;
    const cur = statusAt(hist, Date.now());
    if (cur) HUB.set(['status', p], { place: cur.place, activity: cur.activity, ts: Date.now() });
    HUB.set(['history', p], hist);
    // a small starter garden so the first look isn't empty

/* ---------------------------- loop ---------------------------- */
const CLOCKS = [];
let lastT = performance.now();
function loop(now) {

}

function statusControls(box, person) {
  const row = h('div', { class: 'row' }, box);
  h('span', { class: 'lab', text: `${PEOPLE[person].name}'s real-world status (from phone, simulated)` }, row);
  const bs = {};
  for (const pl of ['home', 'out']) bs[pl] = h('button', { class: 'b', text: pl === 'home' ? 'Home' : 'Out', onclick: () => setStatus(person, { place: pl }) }, row);
  const row2 = h('div', { class: 'row' }, box);
  for (const [a, lab] of ACTS) bs[a] = h('button', { class: 'b', text: lab, onclick: () => setStatus(person, { activity: a }) }, row2);
  HUB.subscribe(s => { const st = s.status[person] || {}; for (const k in bs) bs[k].classList.toggle('on', st.place === k || st.activity === k); });
}
function globalControls(box) {
  const mk = (title) => { const c = h('div', { class: 'ctlcard' }, box); h('h4', { text: title }, c); return c; };
  const t = mk('Togetherness');
  let r = h('div', { class: 'row' }, t);
  h('button', { class: 'b hot', text: 'Both approach & stay', onclick: () => { Sound.ensure(); CLOCKS.forEach((c, i) => setTimeout(() => c.det.setNear(true), i * 1400)); } }, r);
  h('button', { class: 'b', text: 'Both leave', onclick: () => CLOCKS.forEach(c => c.det.setNear(false)) }, r);
  h('div', { class: 'pstate', text: 'They start 1.4 s apart on purpose: being there at the same time is enough.' }, t);
  const f = mk('Flowers');
  r = h('div', { class: 'row' }, f);
  h('button', { class: 'b', text: 'Grow on parents’ clock', onclick: () => growOn('parents') }, r);
  h('button', { class: 'b', text: 'Grow on Yichen’s clock', onclick: () => growOn('me') }, r);
  r = h('div', { class: 'row' }, f);
  h('button', { class: 'b', text: 'Fast-forward a month', onclick: () => { for (let i = 0; i < 40; i++) setTimeout(() => { growOn('parents'); growOn('me'); }, i * 60); } }, r);
  h('button', { class: 'b', text: 'Reset everything', onclick: () => { if (HUB.kind === 'local') { HUB.reset({}); seedIfNeeded(); } else HUB.reset({}); } }, r);
  const s = mk('Sound & sync');
  r = h('div', { class: 'row' }, s);
  const sb = h('button', { class: 'b' + (Sound.on ? ' on' : ''), text: 'Sound', onclick: () => { Sound.on = !Sound.on; Sound.ensure(); sb.classList.toggle('on', Sound.on); } }, r);
  const badge = h('span', { class: 'badge ' + (HUB.kind === 'local' ? 'sim' : 'live') }, r);
  r = h('div', { class: 'row' }, s);
  h('button', { class: 'b', text: 'Test phone push', onclick: () => Push.send(CLOCKS[0].id, true) }, r);
  const pl = h('div', { class: 'pstate' }, s);
  setInterval(() => { pl.textContent = 'push: ' + (Push.cfg ? Push.cfg.replace(/:(.{4}).*/, ':$1…') : 'off') + (Push.last ? ' · ' + Push.last : ''); }, 500);
  const lab = h('div', { class: 'pstate' }, s);
  setInterval(() => { badge.textContent = HUB.kind === 'local' ? 'Simulated' : 'Live'; lab.textContent = HUB.label(); }, 500);
}

/* ---------------------------- pages ---------------------------- */
function sensorAdapter(c) {
  // Optional: real hardware. ?sensor=ws://<esp32-ip>:81  — sends "near"/"far" or {"near":true}
  const url = Q.get('sensor'); if (!url) return;
  const connect = () => {
    let ws; try { ws = new WebSocket(url); } catch (e) { return; }
    ws.onmessage = e => { let v = e.data; try { const j = JSON.parse(v); v = j.near; } catch (_) { v = v === 'near' || v === '1'; } c.det.setNear(!!v); };
    ws.onclose = () => { c.det.setNear(false); setTimeout(connect, 3000); };
  };
  connect();
}
async function keepAwake() {
  try { if ('wakeLock' in navigator) { let lock = await navigator.wakeLock.request('screen'); document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible') lock = await navigator.wakeLock.request('screen'); }); } } catch (e) {}
}
function clockPage(id) {
  document.body.className = 'clockpage';
  const app = document.getElementById('app');
  const stage = h('div', { class: 'stage' }, app);
  const scale = parseFloat(Q.get('scale') || '0.96');
  // Size and centre the clock on the part of the screen that is actually visible.
  // (Robust to iPad "desktop website" mode, Chrome on iPad, rotation and toolbars.)
  const fit = () => {
    const vv = window.visualViewport, W = vv ? vv.width : innerWidth, H = vv ? vv.height : innerHeight;
    let x = vv ? vv.offsetLeft : 0, y = vv ? vv.offsetTop : 0, w = W, ht = H;
    const pnl = document.querySelector('.devpanel'), devOpen = pnl && !pnl.classList.contains('hidden');
    if (pnl) pnl.style.maxHeight = '';
    if (devOpen && W > H) { x += 364; w -= 364; }                       // landscape: clock to the right of the panel
    else if (devOpen) { ht = Math.round(H * .56); if (pnl) pnl.style.maxHeight = (H - ht - 24) + 'px'; }   // portrait: clock on top, panel below
    stage.style.left = x + 'px'; stage.style.top = y + 'px';
    stage.style.width = w + 'px'; stage.style.height = ht + 'px';
    stage.style.setProperty('--size', (Math.min(w, ht) * scale).toFixed(1) + 'px');
  };
  window.__pbFit = fit; fit(); addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 300));
  if (window.visualViewport) { visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', fit); }
  if (Q.get('ox')) stage.style.setProperty('--ox', Q.get('ox') + 'px');
  if (Q.get('oy')) stage.style.setProperty('--oy', Q.get('oy') + 'px');
  const tz = Q.get('tz') === 'device' ? DEVICE_TZ : (Q.get('tz') || undefined);
  const c = new Clock(stage, id, { tz }); CLOCKS.push(c);
  sensorAdapter(c); keepAwake();
  // hidden developer panel: press "d", add ?dev=1, or tap the top-left corner three times
  const panel = h('div', { class: 'devpanel' + (Q.get('dev') ? '' : ' hidden') }, app);
  const syncDev = () => { document.body.classList.toggle('devopen', !panel.classList.contains('hidden')); window.__pbFit && window.__pbFit(); };
  new MutationObserver(syncDev).observe(panel, { attributes: true, attributeFilter: ['class'] }); syncDev();
  h('h4', { text: (id === 'parents' ? 'Parents’ clock' : 'Yichen’s clock') + ' · developer' }, panel);
  presenceControls(panel, c);
  cameraControls(panel, c);
  statusControls(panel, c.shows);
  globalControls(panel);
  // On the installed iPads: ?camera=1 starts the front camera automatically.
  if (Q.get('camera') === '1') {
    Camera.owner = c; Camera.start(c.det);
    window.addEventListener('pointerdown', () => { if (Camera.state === 'error') { Camera.state = 'off'; Camera.start(c.det); } });
  }
  if (Q.get('camdebug') === '1') Camera.preview = h('canvas', { class: 'campreview', width: 200, height: 150 }, document.body);
  h('div', { class: 'pstate', html: `<a style="color:#e3c995" href="#demo">open side-by-side demo</a>` }, panel);
  window.addEventListener('keydown', e => {
    if (e.key === 'd') panel.classList.toggle('hidden');
    if (e.key === 'p') c.det.setNear(!c.det.near);
  });
  let taps = [];
  window.addEventListener('pointerdown', e => {
    Sound.ensure();
    if (e.clientX < 90 && e.clientY < 90) { const n = performance.now(); taps = taps.filter(t => n - t < 900); taps.push(n); if (taps.length >= 3) { panel.classList.toggle('hidden'); taps = []; } }
  });
}
function demoPage() {
  document.body.className = 'demo';
  const app = document.getElementById('app');
  const w = h('div', { class: 'demo-wrap' }, app);
  const head = h('div', { class: 'demo-head' }, w);
  h('h1', { text: 'Peekabloom' }, head); h('i', { text: 'a little peek, a little bloom' }, head);
  const pair = h('div', { class: 'pair' }, w);
  const cols = {
    parents: ['Parents’ clock', 'in China · Shanghai time · shows Yichen (Pip)'],
    me: ['Yichen’s clock', 'in Philadelphia · local time · shows Mom & Dad (the Tangyuans)']
  };
  for (const id of ['parents', 'me']) {
    const col = h('div', { class: 'clockcol' }, pair);
    const box = h('div', { class: 'clockbox' }, col);
    const c = new Clock(box, id); CLOCKS.push(c);
    const cap = h('div', { class: 'cap' }, col); h('b', { text: cols[id][0] }, cap); h('small', { text: cols[id][1] }, cap);
    const card = h('div', { class: 'ctlcard' }, col);
    h('h4', { text: 'Someone at this clock' }, card);
    presenceControls(card, c);
    cameraControls(card, c);
    statusControls(card, c.shows);
    h('div', { class: 'pstate', html: `open on its own: <a style="color:#e3c995" href="#${id}">#${id}</a> &nbsp;(press <b>d</b> there for controls)` }, card);
  }
  const g = h('div', { class: 'global' }, w); globalControls(g);
  h('div', {
    class: 'note', html: `<b>How to read this.</b> Each clock shows the <i>other</i> person. Press <b>Approach &amp; stay</b> and wait three seconds: the hands wiggle and turn toward their house (home) or the pond and woods (out), the other person's character appears, and a bud starts growing on the <i>other</i> clock. Do it on both sides to see the two clocks come together.<br><br>
    <b>Simulated vs. live.</b> Everything on this page runs in this browser. Without a <code>?db=</code> parameter the two clocks share state locally, and the standalone tabs stay in sync only on the same computer. Add <code>?db=https://&lt;project&gt;-default-rtdb.firebaseio.com</code> to make two iPads share presence, status and gardens through Firebase. Status and activity always come from these controls for now; the phone integrations are not built yet.`
  }, w);
}

/* ---------------------------- boot ---------------------------- */
seedIfNeeded();
const hash = location.hash.replace(/^#\/?/, '');
const last = location.pathname.replace(/\/+$/, '').split('/').pop();
const route = ['parents', 'me', 'demo'].includes(hash) ? hash : (['parents', 'me'].includes(last) ? last : 'demo');
if (route === 'demo') demoPage(); else clockPage(route);
window.addEventListener('hashchange', () => location.reload());
requestAnimationFrame(loop);
window.Peekabloom = { HUB, CLOCKS, setStatus, growOn };
})();
</script>
